services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tumeke-task
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./tumeke-task.sql:/docker-entrypoint-initdb.d/01-tumeke-task.sql:ro
      - ./docker/initdb/02-drop-duplicate-indexes.sql:/docker-entrypoint-initdb.d/02-drop-duplicate-indexes.sql:ro
    healthcheck:
      # TCP check: during init scripts the temporary server listens only on the unix socket
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U admin -d tumeke-task']
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: .
    environment:
      DB_URL: postgres://admin:password@db:5432/tumeke-task
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
