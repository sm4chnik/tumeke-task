services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tumeke-task
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./tumeke-task.sql:/docker-entrypoint-initdb.d/01-tumeke-task.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d tumeke-task']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  db-data:
